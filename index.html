<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vintage TV Machine</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Main TV Wrapper Container -->
  <div class="tv-wrapper">
    
    <!-- Top Section Grid (Screen+Regex Left, Inputs Right) -->
    <div class="top-grid">
      
      <!-- Left Column (Screen & Active Regex) -->
      <div class="left-column">
        
        <!-- Screen Panel -->
        <div class="panel screen-panel">
          <!-- Black Screen -->
          <div id="screen-display" class="screen-display">
            DFA Placeholder Screen
          </div>

          <!-- Machine Type Buttons -->
          <div class="machine-buttons">
            <button id="btn-dfa" class="btn-machine active">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="15" x="2" y="7" rx="2" ry="2"/><polyline points="17 2 12 7 7 2"/></svg>
              DFA
            </button>
            <button id="btn-cfg" class="btn-machine inactive">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6c.6 0 1.2-.2 1.8-.6.5-.4 1.2-.4 1.8 0 .6.4 1.2.6 1.8.6.6 0 1.2-.2 1.8-.6.5-.4 1.2-.4 1.8 0 .6.4 1.2.6 1.8.6"/><path d="M2 12c.6 0 1.2-.2 1.8-.6.5-.4 1.2-.4 1.8 0 .6.4 1.2.6 1.8.6.6 0 1.2-.2 1.8-.6.5-.4 1.2-.4 1.8 0 .6.4 1.2.6 1.8.6"/><path d="M2 18c.6 0 1.2-.2 1.8-.6.5-.4 1.2-.4 1.8 0 .6.4 1.2.6 1.8.6.6 0 1.2-.2 1.8-.6.5-.4 1.2-.4 1.8 0 .6.4 1.2.6 1.8.6"/></svg>
              CFG
            </button>
            <button id="btn-pda" class="btn-machine inactive">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/><path d="M5 3v4"/><path d="M19 17v4"/><path d="M3 5h4"/><path d="M17 19h4"/></svg>
              PDA
            </button>
          </div>
        </div>

        <!-- Active Regex Panel -->
        <div class="panel regex-panel">
          <div class="regex-label">
            <span class="regex-dot"></span> Active Regex
          </div>
          <div class="regex-code-wrapper">
            <code id="regex-display" class="regex-code">
              (bab + bbb) a *b* (a *+ b*) (ba) *(aba) (bab + aba)* bb (a + b)* (bab + aba) (a+b)
            </code>
          </div>
        </div>

      </div>

      <!-- Right Column (Inputs Panel) -->
      <div class="panel right-column">
        <!-- Generate 5 inputs -->
        <div class="input-row"><label class="input-label">Input 1:</label><input id="input-1" class="input-field" type="text" placeholder="Enter value 1"></div>
        <div class="input-row"><label class="input-label">Input 2:</label><input id="input-2" class="input-field" type="text" placeholder="Enter value 2"></div>
        <div class="input-row"><label class="input-label">Input 3:</label><input id="input-3" class="input-field" type="text" placeholder="Enter value 3"></div>
        <div class="input-row"><label class="input-label">Input 4:</label><input id="input-4" class="input-field" type="text" placeholder="Enter value 4"></div>
        <div class="input-row"><label class="input-label">Input 5:</label><input id="input-5" class="input-field" type="text" placeholder="Enter value 5"></div>
      </div>

    </div>

    <!-- Bottom Section (Controls) -->
    <div class="panel bottom-controls">
      
      <!-- Left: Change Regex Toggle -->
      <div class="control-group">
        <span class="control-title">Change Regex</span>
        <button id="regex-switch" class="toggle-switch off">
          <div class="toggle-knob"></div>
        </button>
      </div>

      <!-- Middle: Choose Input Radios -->
      <div class="control-group control-group-center">
        <span class="control-title">Choose Input to Validate</span>
        <div class="radio-container">
          <button class="radio-btn active" data-val="1">
            <div class="radio-circle"><div class="radio-inner-circle"></div></div>
            <span class="radio-text">Input 1</span>
          </button>
          <button class="radio-btn inactive" data-val="2">
            <div class="radio-circle"><div class="radio-inner-circle"></div></div>
            <span class="radio-text">Input 2</span>
          </button>
          <button class="radio-btn inactive" data-val="3">
            <div class="radio-circle"><div class="radio-inner-circle"></div></div>
            <span class="radio-text">Input 3</span>
          </button>
          <button class="radio-btn inactive" data-val="4">
            <div class="radio-circle"><div class="radio-inner-circle"></div></div>
            <span class="radio-text">Input 4</span>
          </button>
          <button class="radio-btn inactive" data-val="5">
            <div class="radio-circle"><div class="radio-inner-circle"></div></div>
            <span class="radio-text">Input 5</span>
          </button>
        </div>
      </div>

      <!-- Right: Validate Button -->
      <button id="validate-btn" class="validate-btn">Validate</button>

    </div>

    <!-- Decorative Speaker Grills -->
    <div id="speaker-grills" class="speaker-grills">
      <!-- Generated via JS for cleaner HTML file -->
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
